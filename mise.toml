[tools]
node = "26.10.0"
bun = "1.4.2"

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Start the Astro development server"
run = "bun run dev"

[tasks.check]
description = "Check Astro and TypeScript"
run = "bun run check"

[tasks.build]
description = "Build the static website"
run = "bun run build"

[tasks.preview]
description = "Preview the production build"
run = "bun run preview"
